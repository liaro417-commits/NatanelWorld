<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NatanelWorld</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=Lexend:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--a:255,255,255;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{background:#000;scrollbar-color:#8a8a8a #151515}
body{min-height:100%;background:#000;color:#fff;font-family:'Rubik','Heebo',Arial,sans-serif;overflow-x:hidden}
::-webkit-scrollbar{width:14px}::-webkit-scrollbar-track{background:#151515}::-webkit-scrollbar-thumb{background:#8a8a8a;border-radius:8px;border:3px solid #151515}
#grid{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.t{position:absolute;width:58px;height:58px;border-radius:15px;border:1.5px solid rgba(255,255,255,.28);background:radial-gradient(circle at 50% 50%,#050505 35%,#101010);box-shadow:inset 0 0 14px rgba(255,255,255,.07);transition:background 1.2s,border-color 1.2s,box-shadow 1.2s}
.t.on{background:rgba(255,255,255,.26);border-color:rgba(255,255,255,.85);box-shadow:0 0 26px rgba(255,255,255,.55),inset 0 0 16px rgba(255,255,255,.22);transition-duration:.6s}
.beam{position:fixed;z-index:1;pointer-events:none;border-radius:2px;opacity:0;background:linear-gradient(var(--d),transparent,#fff 55%,rgba(255,255,255,.25));box-shadow:0 0 16px #fff,0 0 30px rgba(255,255,255,.6)}
main{position:relative;z-index:2;max-width:450px;margin:0 auto;padding:44px 16px 70px;display:flex;flex-direction:column;align-items:center}
.avatar{width:134px;height:134px;border-radius:50%;padding:3px;border:2px solid rgba(255,255,255,.9);background:#000;box-shadow:0 0 0 3px rgba(255,255,255,.12),0 0 30px rgba(255,255,255,.3);animation:float 5s ease-in-out infinite,pulse 3.5s ease-in-out infinite}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
@keyframes float{50%{translate:0 -7px}}
@keyframes pulse{50%{box-shadow:0 0 0 3px rgba(255,255,255,.2),0 0 46px rgba(255,255,255,.55)}}
h1{margin-top:28px;font-size:54px;line-height:1;font-weight:800;direction:ltr;letter-spacing:-.5px;text-shadow:0 0 14px #fff,0 0 40px rgba(255,255,255,.6);animation:glow 3.5s ease-in-out infinite alternate}
@keyframes glow{to{text-shadow:0 0 8px rgba(255,255,255,.7),0 0 64px rgba(255,255,255,.9)}}
.sub{margin:14px 0 32px;font-size:17px;line-height:20px;font-weight:500;text-shadow:0 0 12px rgba(255,255,255,.8)}
.card{position:relative;width:100%;height:84px;display:flex;align-items:center;gap:17px;padding:0 22px 0 18px;margin-bottom:16px;border-radius:22px;text-decoration:none;color:inherit;overflow:hidden;
 background:rgba(0,0,0,.38);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
 border:1.5px solid #fff;box-shadow:inset 0 0 18px rgba(255,255,255,.08),0 0 14px rgba(255,255,255,.22),0 6px 26px rgba(0,0,0,.6);
 animation:in .8s cubic-bezier(.2,.8,.2,1) backwards,bob 6s ease-in-out infinite;transition:transform .25s,box-shadow .3s,background .3s}
.card:nth-of-type(1){animation-delay:.1s,0s}.card:nth-of-type(2){animation-delay:.2s,-1.2s}.card:nth-of-type(3){animation-delay:.3s,-2.4s}.card:nth-of-type(4){animation-delay:.4s,-3.6s}.card:nth-of-type(5){animation-delay:.5s,-4.8s}.card:nth-of-type(6){animation-delay:.6s,-6s}
@keyframes in{from{opacity:0;transform:translateY(34px) scale(.96)}}
@keyframes bob{50%{translate:0 -3px}}
.card::before{content:"";position:absolute;top:-10%;bottom:-10%;width:45%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.16),transparent);transform:skewX(-20deg);animation:shine 7s ease-in-out infinite;animation-delay:inherit}
.card:nth-of-type(2)::before{animation-delay:1.4s}.card:nth-of-type(3)::before{animation-delay:2.8s}.card:nth-of-type(4)::before{animation-delay:4.2s}.card:nth-of-type(5)::before{animation-delay:5.6s}.card:nth-of-type(6)::before{animation-delay:6.3s}
@keyframes shine{0%,70%{left:-60%}100%{left:130%}}
.card:hover{background:rgba(255,255,255,.08);box-shadow:0 0 26px rgba(255,255,255,.45),inset 0 0 22px rgba(255,255,255,.1),0 10px 34px rgba(0,0,0,.7)}
.card:active{scale:.97}
.ico{flex:none;width:52px;height:52px;border-radius:13px;border:1.5px solid rgba(255,255,255,.85);background:rgba(0,0,0,.45);display:grid;place-items:center;font-weight:800;font-size:19px;box-shadow:inset 0 0 10px rgba(255,255,255,.08);transition:transform .35s}
.card:hover .ico{transform:rotate(-8deg) scale(1.1)}
.ico svg{width:27px;height:27px;fill:#fff}
.ico svg.s{fill:none;stroke:#fff;stroke-width:2.2}
.txt{flex:1;text-align:left}
.txt b{display:block;font-size:21px;line-height:24px;font-weight:800}
.txt span{display:block;margin-top:3px;font-size:14px;line-height:18px;font-weight:500;opacity:.92}
.chev{flex:none;width:13px;height:20px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s}
.card:hover .chev{transform:translateX(7px)}
.donate{width:100%;margin-top:14px;padding:20px 0 0;height:150px;border-radius:22px;text-align:center;background:rgba(0,0,0,.38);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);border:1.5px solid #fff;box-shadow:inset 0 0 18px rgba(255,255,255,.05);animation:in .8s .6s backwards}
.donate b{display:block;font-size:17px;line-height:20px;font-weight:800}
.donate a{display:block;width:245px;margin:14px auto 0;padding:13px;border-radius:14px;background:#fff;color:#000;font-weight:800;text-decoration:none;transition:transform .25s,box-shadow .25s}
.donate a:hover{transform:scale(1.05);box-shadow:0 0 24px rgba(255,255,255,.8)}
@media(max-width:480px){h1{font-size:44px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}

.t{border:2px solid rgba(255,255,255,.3);border-radius:18px;background:radial-gradient(circle,#040404 40%,#0e0e0e);box-shadow:0 0 9px rgba(255,255,255,.14),inset 0 0 12px rgba(255,255,255,.12);transition:background 1.6s,border-color 1.6s,box-shadow 1.6s}
.t.on{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.85);box-shadow:0 0 22px rgba(255,255,255,.5),inset 0 0 14px rgba(255,255,255,.2);transition-duration:1s}
#layer{position:absolute;inset:0;will-change:transform}
.nt .t{transition:none!important}
.beam{position:absolute}
.card{background:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px) 0 0/20px 20px,linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px) 0 0/20px 20px,rgba(0,0,0,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:20px;animation:in .8s cubic-bezier(.2,.8,.2,1) backwards,bob 5s ease-in-out infinite,halo 4s ease-in-out infinite}
.card:hover{background:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px) 0 0/20px 20px,linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px) 0 0/20px 20px,rgba(255,255,255,.1)}
@keyframes bob{50%{translate:0 -5px}}
@keyframes halo{0%,100%{box-shadow:inset 0 0 18px rgba(255,255,255,.08),0 0 8px rgba(255,255,255,.3),0 6px 26px rgba(0,0,0,.6)}50%{box-shadow:inset 0 0 22px rgba(255,255,255,.14),0 0 22px rgba(255,255,255,.75),0 6px 26px rgba(0,0,0,.6)}}
.avatar{animation:pulse 4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(255,255,255,.12),0 0 24px rgba(255,255,255,.35)}50%{box-shadow:0 0 0 3px rgba(255,255,255,.25),0 0 54px rgba(255,255,255,.8)}}
h1{font-family:'Lexend','Rubik',Arial,sans-serif;font-weight:700;font-size:52px}
.sub{color:#d3d8e8}.txt span{color:#cfd5e6}
</style>
</head>

<script>
const grid=document.getElementById('grid'),P=60,layer=document.createElement('div');
layer.id='layer';grid.appendChild(layer);
let tiles=[],X0=0,Y0=-7,W=0,H=0,C=0;const lit=new Map();
function build(){
  W=innerWidth;H=innerHeight;
  const m=Math.ceil(W/2/P)+1;X0=W/2-m*P;
  C=m*2+3;const R=Math.ceil(H/P)+3;
  layer.innerHTML='';tiles=[];lit.clear();
  const f=document.createDocumentFragment();
  for(let j=-1;j<R-1;j++)for(let i=-1;i<C-1;i++){
    const d=document.createElement('div');d.className='t';
    d.style.left=(X0+i*P+1)+'px';d.style.top=(Y0+j*P+1)+'px';
    f.appendChild(d);tiles.push(d);
  }
  layer.appendChild(f);
}
build();addEventListener('resize',build);
function light(n){
  for(let k=0;k<n;k++){
    const i=Math.floor(Math.random()*tiles.length);
    tiles[i].classList.add('on');lit.set(i,performance.now()+2000+Math.random()*3000);
  }
}
light(7);setInterval(()=>light(1),550);
function shift(){
  grid.classList.add('nt');
  const n=new Map();
  for(const [i,e] of lit){tiles[i].classList.remove('on');const k=i+C+1;if(i%C<C-1&&k<tiles.length){n.set(k,e);tiles[k].classList.add('on')}}
  lit.clear();for(const [k,e] of n)lit.set(k,e);
  void grid.offsetWidth;grid.classList.remove('nt');
}
let prev=0;
function tick(now){
  const off=(now/1000*6.7)%P;
  layer.style.transform='translate('+off+'px,'+off+'px)';
  if(off<prev-30)shift();prev=off;
  for(const [i,e] of lit)if(now>e){tiles[i].classList.remove('on');lit.delete(i)}
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
function beam(){
  const b=document.createElement('div');b.className='beam';
  const v=Math.random()<.7,len=150+Math.random()*130,dist=260+Math.random()*320,dur=5000+Math.random()*4000;
  let from,to;
  if(v){
    const k=Math.floor(Math.random()*(W/P))+1;
    b.style.left=(X0+k*P-1)+'px';b.style.top=(Math.random()*H*.7)+'px';b.style.width='2px';b.style.height=len+'px';b.style.setProperty('--d','to bottom');
    from='translateY(0)';to='translateY('+dist+'px)';
  }else{
    const k=Math.floor(Math.random()*(H/P))+1;
    b.style.top=(Y0+k*P-1)+'px';b.style.left=(Math.random()*W*.7)+'px';b.style.height='2px';b.style.width=len+'px';b.style.setProperty('--d','to right');
    from='translateX(0)';to='translateX('+dist+'px)';
  }
  layer.appendChild(b);
  const a=b.animate([{transform:from,opacity:0},{opacity:.9,offset:.2},{opacity:.9,offset:.75},{transform:to,opacity:0}],{duration:dur,easing:'ease-in-out'});
  a.onfinish=()=>b.remove();
}
for(let i=0;i<5;i++)setTimeout(beam,i*500);
setInterval(beam,1100);
</script>
